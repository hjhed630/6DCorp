<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .success-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(50, 120, 70, 0.1);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
            animation: scaleIn 0.8s ease-out;
        }

        .success-icon i {
            font-size: 38px;
            color: white;
            animation: checkmark 0.5s ease-out 0.3s both;
        }

        .success-header h1 {
            color: #2E7D32;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .success-header p {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .order-details {
            background-color: #f9fdf9;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #e0f2e0;
            text-align: left;
        }

        .order-details h2 {
            color: #2E7D32;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0f2e0;
            font-size: 18px;
            text-align: center;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e0e0e0;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
            min-width: 100px;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
            flex: 1;
        }

        .highlight {
            color: #2E7D32;
            font-size: 18px;
            font-weight: 700;
        }

        .payment-method {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 20px;
        }

        .payment-icon {
            font-size: 24px;
            color: #1677ff;
        }

        .payment-name {
            font-size: 16px;
            font-weight: 600;
            color: #1677ff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background-color: #e8f5e9;
            color: #2E7D32;
            border: 1px solid #a5d6a7;
            margin-left: 10px;
        }

        .footer-note {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
            text-align: center;
        }

        /* 动画 */
        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fadeInUp {
            animation: fadeInUp 0.5s ease-out;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                max-width: 95%;
            }

            .success-card {
                padding: 25px 20px;
            }

            .success-header h1 {
                font-size: 22px;
            }

            .success-header p {
                font-size: 15px;
            }

            .detail-label {
                min-width: 90px;
            }
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 20px 15px;
            }

            .success-icon {
                width: 70px;
                height: 70px;
            }

            .success-icon i {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="success-card">
            <!-- 成功图标 -->
            <div class="success-header">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h1>支付成功</h1>
                <p>感谢您的购买，我们已开始处理您的订单</p>

                <!-- 支付方式显示 -->
                <div class="payment-method" id="payment-method-display">
                    <i class="fab fa-alipay payment-icon"></i>
                    <span class="payment-name">支付宝支付</span>
                </div>
            </div>

            <!-- 订单详情 -->
            <div class="order-details animate-fadeInUp">
                <h2>订单详情 <span class="status-badge" id="trade-status">成功</span></h2>
                <div class="details-list">
                    <div class="detail-item">
                        <span class="detail-label">商品名称：</span>
                        <span class="detail-value" id="product-name">六维语宇宙语料购买</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">支付金额：</span>
                        <span class="detail-value highlight" id="payment-amount">¥ 1.00</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">订单号：</span>
                        <span class="detail-value" id="out-trade-no">7061635826942147</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">支付时间：</span>
                        <span class="detail-value" id="payment-time">2025-02-09 13:52:39</span>
                    </div>
                </div>
            </div>

            <!-- 页脚提示 -->
            <div class="footer-note animate-fadeInUp">
                <p>如有任何疑问，请联系客服中心</p>
            </div>
        </div>
    </div>

    <script>
        // 解析URL参数
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');

            for (let pair of pairs) {
                const [key, value] = pair.split('=');
                if (key && value) {
                    params[decodeURIComponent(key)] = decodeURIComponent(value.replace(/\+/g, ' '));
                }
            }

            return params;
        }

        // 格式化时间戳
        function formatTimestamp(timestamp) {
            if (!timestamp) return '未知时间';

            // 如果时间戳是10位，则乘以1000转换为毫秒
            const ts = timestamp.length === 10 ? parseInt(timestamp) * 1000 : parseInt(timestamp);
            const date = new Date(ts);

            return date.getFullYear() + '-' +
                String(date.getMonth() + 1).padStart(2, '0') + '-' +
                String(date.getDate()).padStart(2, '0') + ' ' +
                String(date.getHours()).padStart(2, '0') + ':' +
                String(date.getMinutes()).padStart(2, '0') + ':' +
                String(date.getSeconds()).padStart(2, '0');
        }

        // 根据支付类型获取支付方式名称和图标
        function getPaymentInfo(paymentType) {
            const paymentMethods = {
                'alipay': { name: '支付宝支付', icon: 'fab fa-alipay', color: '#1677ff' },
                'wxpay': { name: '微信支付', icon: 'fab fa-weixin', color: '#09bb07' },
                'unionpay': { name: '银联支付', icon: 'fas fa-credit-card', color: '#f00' },
                'paypal': { name: 'PayPal', icon: 'fab fa-paypal', color: '#003087' }
            };

            return paymentMethods[paymentType] || { name: '未知支付方式', icon: 'fas fa-money-bill-wave', color: '#666' };
        }

        // 根据交易状态获取显示信息
        function getTradeStatusInfo(status) {
            const statusMap = {
                'TRADE_SUCCESS': { title: '支付成功', message: '感谢您的购买，我们已开始处理您的订单', badge: '成功', color: '#2E7D32' },
                'TRADE_FINISHED': { title: '交易完成', message: '交易已完成，感谢您的购买！', badge: '完成', color: '#2E7D32' },
                'TRADE_CLOSED': { title: '交易关闭', message: '交易已关闭，如有疑问请联系客服。', badge: '关闭', color: '#f44336' },
                'WAIT_BUYER_PAY': { title: '等待支付', message: '订单已创建，等待您完成支付。', badge: '待支付', color: '#ff9800' }
            };

            return statusMap[status] || { title: '未知状态', message: '订单状态未知，请查看订单详情或联系客服。', badge: '未知', color: '#666' };
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 获取URL参数
            const params = getUrlParams();

            // 根据交易状态设置页面标题和消息
            const tradeStatus = params.trade_status || 'TRADE_SUCCESS';
            const statusInfo = getTradeStatusInfo(tradeStatus);

            document.querySelector('h1').textContent = statusInfo.title;
            document.querySelector('.success-header p').textContent = statusInfo.message;
            document.getElementById('trade-status').textContent = statusInfo.badge;
            document.getElementById('trade-status').style.color = statusInfo.color;
            document.getElementById('trade-status').style.borderColor = statusInfo.color + '80';

            // 设置支付方式
            const paymentType = params.type || 'alipay';
            const paymentInfo = getPaymentInfo(paymentType);
            const paymentMethodDisplay = document.getElementById('payment-method-display');
            paymentMethodDisplay.innerHTML = `<i class="${paymentInfo.icon} payment-icon"></i><span class="payment-name">${paymentInfo.name}</span>`;
            document.querySelector('.payment-icon').style.color = paymentInfo.color;
            document.querySelector('.payment-name').style.color = paymentInfo.color;

            // 填充订单信息
            document.getElementById('product-name').textContent = params.name || '未知商品';
            document.getElementById('payment-amount').textContent = '¥ ' + (parseFloat(params.money || 0).toFixed(2));
            document.getElementById('out-trade-no').textContent = params.out_trade_no || '未知';
            document.getElementById('payment-time').textContent = formatTimestamp(params.timestamp || Date.now().toString().substring(0, 10));

            // 如果是成功状态，添加简单的动画效果
            if (tradeStatus === 'TRADE_SUCCESS' || tradeStatus === 'TRADE_FINISHED') {
                // 添加成功动画
                setTimeout(() => {
                    const icon = document.querySelector('.success-icon');
                    icon.style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        icon.style.transform = 'scale(1)';
                    }, 200);
                }, 500);
            }

            // 自动关闭窗口的选项（5秒后）
            setTimeout(() => {
                // 如果是iframe内嵌，尝试关闭窗口
                if (window.self !== window.top) {
                    try {
                        window.parent.postMessage({ type: 'PAYMENT_SUCCESS_CLOSE' }, '*');
                    } catch (e) {
                        console.log('无法发送关闭消息');
                    }
                }
            }, 5000);

            // 监听消息关闭
            window.addEventListener('message', function (event) {
                if (event.data === 'CLOSE_PAYMENT_WINDOW') {
                    window.close();
                }
            });
        });
    </script>
</body>

</html>
